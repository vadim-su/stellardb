[tools]
rust = "stable"
bun = "1.3.13"

[tasks.install]
description = "Install locked Station dependencies"
dir = "station"
run = "bun install --frozen-lockfile"

[tasks.build]
description = "Build StellarDB with the embedded Station"
depends = ["install"]
run = "cargo build --all-features"

[tasks.station]
description = "Build the Station web application"
depends = ["install"]
dir = "station"
run = "bun run build"

[tasks.check]
description = "Run formatting, linting, and all tests"
depends = ["install"]
run = [
  "cargo fmt --all --check",
  "cargo clippy --workspace --all-targets --all-features -- -D warnings",
  "cargo test --workspace --all-targets",
]
